name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore VoidNoteStudio.sln
      - name: Build
        run: dotnet build VoidNoteStudio.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test VoidNoteStudio.sln --configuration Release --no-build --no-restore
