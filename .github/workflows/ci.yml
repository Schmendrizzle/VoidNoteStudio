name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore VoidNoteStudio.sln
      - name: Build
        run: dotnet build VoidNoteStudio.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test VoidNoteStudio.sln --configuration Release --no-build --no-restore
      - name: Packaging smoke publish
        shell: pwsh
        run: |
          $runtime = if ('${{ runner.os }}' -eq 'Windows') { 'win-x64' } else { 'linux-x64' }
          dotnet publish src/VoidNote.App/VoidNote.App.csproj --configuration Release -p:PublishProfile="$runtime-portable" --output artifacts/smoke
          Get-ChildItem artifacts/smoke -Recurse -Filter '*.pdb' | Remove-Item -Force
          Copy-Item README.md, THIRD_PARTY_NOTICES.md, LICENSE -Destination artifacts/smoke
          python scripts/validate-package.py artifacts/smoke --runtime $runtime
          $appHost = if ($runtime -eq 'win-x64') { 'artifacts/smoke/VoidNote.App.exe' } else { 'artifacts/smoke/VoidNote.App' }
          & $appHost --version
